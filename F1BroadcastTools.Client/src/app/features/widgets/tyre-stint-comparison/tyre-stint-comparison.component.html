@let state = this.state();

@if (state != null) 
{
<div class="tyre-stint-comparison">
    <div class="car-stints"
        [style.grid-template-rows]="'repeat(' + state.cars.length + ',1fr) 1em'"
        [style.grid-template-columns]="'auto repeat(' + state.totalLaps + ',1fr)'">

        @for (car of state.cars; track car.driver.vehicleIdx; let carIndex = $index)
        {
            <div class="driver" [style.grid-column]="1"> {{ car.driver.name }} </div>

            @for (stint of car.tyreStints; track $index) 
            {
            <div class="stint" 
                [style.grid-column]="(stint.startLap + 1) + '/' + 'span ' + stint.duration"
                [style.grid-row]="(carIndex + 1) + '/' + (state.cars.length + 1)">
                <div class="stint-bar" [style.background]="stint.tyreColor"> {{ stint.duration }} </div>
                <img [src]="'/images/icons/tyres/' + stint.tyreCompound + '.svg'" [alt]="stint.tyreCompound" class="tyre">
            </div>
            }
        }

        @for (marker of state.pitStopLapMarkers; track $index) 
        {
        <span class="lap-marker" 
            [style.grid-row]="state.cars.length + 1"
            [style.grid-column]="(marker + 1) + '/' + (marker + 2)"> 
            {{ marker }} 
        </span>   
        }

    </div>

</div>
}
